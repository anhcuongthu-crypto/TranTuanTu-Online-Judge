<title>Contest - TranTu OJ</title>

<style>
:root {
    color-scheme: dark;
    --bg: #0b1120;
    --panel: #111827;
    --line: #263449;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --link: #a5b4fc;
    --input-bg: #0f172a;
    --hover-bg: #1e293b;
    --success: #34d399;
    --danger: #f87171;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 20px; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px Arial, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { color: #c7d2fe; text-decoration: underline; }
header {
    padding: 18px max(5%, calc((100% - 1100px) / 2));
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.brand { font-size: 20px; font-weight: bold; color: var(--text); }
main { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    min-width: 0;
    box-shadow: 0 4px 14px rgb(0 0 0 / 10%);
}
h1 { font-size: 28px; margin: 14px 0; overflow-wrap: anywhere; }
h2 { font-size: 20px; margin-top: 0; }
h3 { overflow-wrap: anywhere; }
.muted { color: var(--muted); line-height: 1.7; }
.grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    align-items: start;
}
.badge {
    display: inline-block;
    padding: 6px 11px;
    background: #252653;
    color: #c7d2fe;
    border: 1px solid #4338ca;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
}
.problem {
    padding: 16px 12px;
    margin: 0 -12px;
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: background .2s;
}
.problem:hover { background: var(--hover-bg); }
.problem h3 { margin: 0 0 7px; }
.score { color: #a5b4fc; font-weight: bold; white-space: nowrap; }
label { display: block; margin-top: 8px; font-weight: bold; }
input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgb(99 102 241 / 20%);
}
textarea {
    min-height: 190px;
    resize: vertical;
    font-family: Consolas, monospace;
    line-height: 1.6;
}
button {
    background: var(--primary);
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 3px;
    transition: background .2s, transform .15s;
}
button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
}
button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.secondary { background: #475569; }
.secondary:hover:not(:disabled) { background: #64748b; }
table { width: 100%; border-collapse: collapse; }
th, td {
    text-align: left;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
    overflow-wrap: anywhere;
}
th { color: var(--muted); background: #172033; }
tbody tr:hover { background: var(--hover-bg); }
.table-wrap { width: 100%; overflow-x: auto; }
.status { white-space: pre-wrap; line-height: 1.6; margin-top: 12px; }
.error { color: var(--danger); white-space: pre-wrap; }
.success { color: var(--success); }
.status-pill {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #273449;
    color: #cbd5e1;
}
.status-ac, .status-accepted { background: #064e3b; color: #a7f3d0; }
.status-wa, .status-wrong { background: #7f1d1d; color: #fecaca; }
.status-pending, .status-running { background: #78350f; color: #fde68a; }
.status-ce { background: #7c2d12; color: #fed7aa; }
.editbox {
    margin-top: 18px;
    padding: 16px;
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
}
#problemDetail { scroll-margin-top: 20px; }
#problemDetail h3 { margin-top: 22px; }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); }
.header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.subtask-table {
    margin: 14px 0 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
}
.subtask-table th:last-child,
.subtask-table td:last-child {
    text-align: right;
    width: 100px;
}
.subtask-table td { padding: 11px 12px; }
.subtask-condition {
    white-space: pre-wrap;
    line-height: 1.7;
    overflow-wrap: anywhere;
}
.subtask-condition:empty::after {
    content: "—";
    color: var(--muted);
}

@media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .panel { padding: 16px; }
    h1 { font-size: 24px; }
    header { padding: 16px 18px; }
    table { font-size: 13px; }
    th, td { padding: 10px 5px; }
}

<body data-contest-id="{{ contest_id|default('', true) }}">
<header>
    <a class="brand" href="/">TranTu OJ</a>
    <div class="header-actions">
        <a href="/library" id="backContest" data-i18n="backContest">← Quay lại thư viện đề thi</a>
        <button type="button" id="languageToggle" class="secondary">🇬🇧 English</button>
    </div>
</header>

<main>
    <section class="panel" id="contestHeader">
        <p class="muted" data-i18n="loadingContest">Đang tải cuộc thi...</p>
    </section>

    <div class="grid">
        <div>
            <section class="panel">
                <h2 data-i18n="problemList">Danh sách bài thi</h2>
                <div id="problems" data-i18n="loading">Đang tải...</div>
            </section>

            <section class="panel contest-stats-anchor" id="contestStats"><h2>Thống kê</h2><p class="muted">Thống kê bài nộp và kết quả trong kỳ thi sẽ hiển thị tại đây.</p><div id="contestStatsSummary"></div></section>
<section class="panel" id="problemDetailPanel" hidden>
                <div id="problemDetail"></div>
            </section>

            <section class="panel">
                <h2 data-i18n="submitTitle">Nộp bài</h2>
                <form id="submitForm">
                    <label for="problemId" data-i18n="chooseProblem">Chọn bài</label>
                    <select id="problemId" required></select>

                    <label for="language" data-i18n="language">Ngôn ngữ</label>
                    <select id="language">
                        <option value="54">C++</option>
                        <option value="50">C</option>
                        <option value="71">Python 3</option>
                    </select>

                    <label for="sourceCode" data-i18n="sourceCode">Mã nguồn</label>
                    <textarea id="sourceCode" maxlength="100000"
                        required placeholder="Nhập code tại đây..." data-i18n-placeholder="sourcePlaceholder"></textarea>

                    <button id="submitButton" type="submit" data-i18n="submitButton">Nộp bài</button>
                    <div id="submitMessage" class="status" role="status"></div>
                </form>
            </section>

        </div>

        <aside>
            <section class="panel">
                <h2 data-i18n="contestInfo">Thông tin cuộc thi</h2>
                <div id="contestInfo" class="muted" data-i18n="loading">Đang tải...</div>
            </section>

        </aside>
    </div>
</main>

let currentLanguage = localStorage.getItem("oj_language") || "vi";
if (!translations[currentLanguage]) currentLanguage = "vi";

function t(key) {
    return translations[currentLanguage][key] ??
        translations.vi[key] ??
        key;
}

function translatePage() {
    document.documentElement.lang = currentLanguage;

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = t(key);
    });

    $("sourceCode").placeholder = t("sourcePlaceholder");

    $("languageToggle").textContent =
        currentLanguage === "vi" ? "🇬🇧 English" : "🇻🇳 Tiếng Việt";

    document.title = "Contest - TranTu OJ";
}

function setLanguage(language) {
    if (!translations[language]) return;

    currentLanguage = language;
    localStorage.setItem("oj_language", language);
    translatePage();

    if (contestData) {
        renderContest();
        if (selectedProblemId !== null) {
            showProblem(selectedProblemId, false);
        }
    }

    if (problemList.length) {
        loadLeaderboard();
        loadContestSubmissions();
    }

    window.dispatchEvent(new CustomEvent("oj-language-changed", {
        detail: { language }
    }));
}

document.addEventListener("oj-language-changed", event => {
    const language = event.detail && event.detail.language;
    if (language && translations[language] && language !== currentLanguage) {
        setLanguage(language);
    }
});

$("languageToggle").addEventListener("click", () => {
    setLanguage(currentLanguage === "vi" ? "en" : "vi");
});

window.addEventListener("storage", event => {
    if (event.key === "oj_language" && translations[event.newValue]) {
        setLanguage(event.newValue);
    }
});

function resolveContestId() {
    const raw = document.body.dataset.contestId || '';

    if (/^\d+$/.test(raw) && Number(raw) > 0) {
        return Number(raw);
    }

    const match = location.pathname.match(/\/contests\/(\d+)\/?$/);

    if (match && Number(match[1]) > 0) {
        return Number(match[1]);
    }

    const query = new URLSearchParams(location.search).get('id');

    if (query && /^\d+$/.test(query) && Number(query) > 0) {
        return Number(query);
    }

    return null;
}

const CONTEST_ID = resolveContestId();

let isAdmin = false;
let submissionRefreshTimer = null;

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[c]);
}

async function api(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        credentials: 'same-origin',
        headers: {
            ...(options.headers || {}),
            ...(options.body !== undefined
                ? { 'Content-Type': 'application/json' }
                : {})
        }
    });

    const raw = await response.text();
    let data;

    try {
        data = raw ? JSON.parse(raw) : {};
    } catch {
        throw new Error(
            `HTTP ${response.status}: API không trả JSON. URL: ${url}`
        );
    }

    if (!response.ok) {
        throw new Error(
            data.error || data.message || `HTTP ${response.status}`
        );
    }

    return data;
}

function dateText(value) {
    if (!value) return t("notSpecified");

    const d = new Date(value);

    return Number.isNaN(d.getTime())
        ? String(value)
        : d.toLocaleString(currentLanguage === "vi" ? "vi-VN" : "en-US");
}

function stateText(state) {
    const states = {
        upcoming: t("upcoming"),
        running: t("running"),
        ended: t("ended")
    };

    return states[state] || state || t("unknown");
}

function normalizeRows(data) {
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.submissions)) return data.submissions;
    if (Array.isArray(data.results)) return data.results;
    if (Array.isArray(data.items)) return data.items;
    return [];
}

function statusClass(status) {
    const s = String(status || '').toUpperCase();

    if (s === 'AC' || s.includes('ACCEPTED')) return 'status-ac';
    if (s === 'WA' || s.includes('WRONG ANSWER')) return 'status-wa';
    if (s.includes('PENDING') || s.includes('QUEUE')) return 'status-pending';
    if (s.includes('RUNNING') || s.includes('PROCESSING')) return 'status-running';
    if (s === 'CE' || s.includes('COMPILATION ERROR')) return 'status-ce';

    return '';
}

function showProblem(pid, scroll = true) {
    const p = problemList.find(x => String(x.id) === String(pid));
    if (!p) return;

    selectedProblemId = p.id;

    const statement = String(
        p.statement || p.description || p.content ||
        p.problem_statement || ''
    );

    const inputDesc = String(
        p.input_desc ?? p.input_description ?? ''
    );

    const outputDesc = String(
        p.output_desc ?? p.output_description ?? ''
    );

    const sampleInput = String(
        p.sample_input ?? p.example_input ?? p.input_example ?? ''
    );

    const sampleOutput = String(
        p.sample_output ?? p.example_output ?? p.output_example ?? ''
    );

    const subtasks = Array.isArray(p.subtasks) ? p.subtasks : [];
    const totalScore = Number(p.total_score) || 0;

function getSubtaskCondition(s) {
    const fields = [
        s.condition,
        s.constraints,
        s.description,
        s.limit,
        s.note,
        s.requirement,
        s.test_description
    ];

    for (const value of fields) {
        if (value === undefined || value === null) continue;

        if (Array.isArray(value)) {
            if (value.length) return value.join('\n');
            continue;
        }

        if (typeof value === 'object') {
            if (Object.keys(value).length)
                return JSON.stringify(value);
            continue;
        }

        if (String(value).trim() !== '') {
            return String(value);
        }
    }

    return 'Không có ràng buộc';
}

    const subtaskHtml = subtasks.length ? `
        <h3>${t("subtasks")}</h3>
        <div class="table-wrap subtask-table">
            <table>
                <thead>
                    <tr>
                        <th>${t("subtask")}</th>
                        <th>${t("condition")}</th>
                        <th>${t("score")}</th>
                    </tr>
                </thead>
                <tbody>
                    ${subtasks.map((s, i) => {
                        const subtaskScore = Number(s.score) || 0;
                        const condition = getSubtaskCondition(s);

                        return `
                            <tr>
                                <td>
                                    ${esc(s.name || (t("subtask") + " " + (i + 1)))}
                                </td>
                                <td class="subtask-condition">${esc(condition)}</td>
                                <td class="score">${Number(subtaskScore.toFixed(2))} ${t("points")}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    ` : '';

    $("problemDetailPanel").hidden = false;
    $("problemDetailPanel").style.display = 'block';

    $("problemDetail").innerHTML = `
        <h2>${esc(p.title || t("problem"))}</h2>

        <p class="muted">
            ID: ${esc(p.id)} · ${totalScore} ${t("points")}
        </p>

        <h3>${t("statement")}</h3>
        <div style="white-space:pre-wrap;line-height:1.8">${esc(
            statement || t("noStatement")
        )}</div>

        ${inputDesc.trim() ? `
            <h3>${t("input")}</h3>
            <div style="white-space:pre-wrap;line-height:1.8">${esc(inputDesc)}</div>
        ` : ''}

        ${outputDesc.trim() ? `
            <h3>${t("output")}</h3>
            <div style="white-space:pre-wrap;line-height:1.8">${esc(outputDesc)}</div>
        ` : ''}

        ${subtaskHtml}

        ${sampleInput !== '' || sampleOutput !== '' ? `
            <h3>${t("example")}</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div>
                    <b>Input</b>
                    <pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;color:#e2e8f0;border:1px solid #263449;padding:12px;border-radius:8px">${esc(sampleInput)}</pre>
                </div>
                <div>
                    <b>Output</b>
                    <pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;color:#e2e8f0;border:1px solid #263449;padding:12px;border-radius:8px">${esc(sampleOutput)}</pre>
                </div>
            </div>
        ` : `<p class="muted">${t("noExample")}</p>`}

        <p>
            <button id="chooseProblem">${t("sendThisProblem")}</button>
            ${isAdmin && p.is_custom
                ? `<button id="editProblem" class="secondary">${t("editProblem")}</button>`
                : ''}
        </p>

        <div id="editArea"></div>
    `;

    $("chooseProblem").onclick = () => {
        $("problemId").value = String(p.id);
        $("submitForm").scrollIntoView({ behavior: 'smooth' });
        $("sourceCode").focus();
    };

    if (isAdmin && p.is_custom) {
        $("editProblem").onclick = () => editProblem(p);
    }

    if (scroll) {
        $("problemDetailPanel").scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }
}

    area.innerHTML = `

            <h3>${t("editTitle")}</h3>

            <label for="editTitle">${t("problemName")}</label>
            <input id="editTitle" value="${esc(p.title)}" required>

<label for="editStatement">${t("statement")}</label>
<textarea id="editStatement">${esc(
    p.statement || p.description || p.content ||
    p.problem_statement || ''
)}</textarea>

<label for="editInput">${t("inputDescription")}</label>
<textarea id="editInput">${esc(
    p.input_desc || p.input_description || ''
)}</textarea>

<label for="editOutput">${t("outputDescription")}</label>
<textarea id="editOutput">${esc(
    p.output_desc || p.output_description || ''

        </div>
    `;

    $("cancelEdit").onclick = () => {
        area.innerHTML = '';
    };

    $("saveProblem").onclick = async () => {
        const title = $("editTitle").value.trim();
        const score = Number($("editScore").value);
        const statement = $("editStatement").value;
        const input_desc = $("editInput").value;
        const output_desc = $("editOutput").value;
        const message = $("editMessage");
        const button = $("saveProblem");

        if (!title || !Number.isFinite(score) || score < 0) {
            message.textContent = t("invalidTitleScore");
            message.className = 'status error';
            return;
        }

        button.disabled = true;
        message.textContent = t("saving");
        message.className = 'status';

        try {
            const result = await api(
                `/api/admin/contests/${CONTEST_ID}/problems/${encodeURIComponent(p.id)}`,
                {
                    method: 'PUT',
                    body: JSON.stringify({
                        title,
                        total_score: score,
                        statement,
                        input_desc,
                        output_desc
                    })
                }
            );

            message.textContent = result.message || t("saved");
            message.className = 'status success';

            await loadContest();
            showProblem(p.id, false);
        } catch (error) {
            message.textContent = t("saveFailed") + error.message;
            message.className = 'status error';
        } finally {
            button.disabled = false;
        }
    };
}

async function loadContestSubmissions() {
    const box = $("contestSubmissions");
    box.innerHTML = `<p class="muted">${t("loadingHistory")}</p>`;

    try {
        const data = await api(`/api/contests/${CONTEST_ID}/submissions`);
        const rows = normalizeRows(data);

        const statsBox = $("contestStatsSummary");
        if (statsBox) {
            const counts = { accepted: 0, wrong: 0, pending: 0, other: 0 };
            rows.forEach(row => {
                const verdict = String(row.verdict || row.status || row.result || '').toUpperCase();
                if (verdict === 'ACCEPTED' || verdict === 'AC' || verdict.includes('ACCEPTED')) counts.accepted++;
                else if (verdict === 'WA' || verdict.includes('WRONG ANSWER')) counts.wrong++;
                else if (verdict.includes('QUEUED') || verdict.includes('PENDING') || verdict.includes('PROCESSING') || verdict.includes('RUNNING')) counts.pending++;
                else counts.other++;
            });
            const total = rows.length;
            const percent = value => total ? Math.round(value * 100 / total) : 0;
            statsBox.innerHTML = total ? `
                <div class="contest-stats-grid">
                    <div><strong>${total}</strong><span>Tổng bài nộp</span></div>
                    <div><strong>${counts.accepted}</strong><span>Accepted</span></div>
                    <div><strong>${counts.wrong}</strong><span>Wrong Answer</span></div>
                    <div><strong>${counts.pending}</strong><span>Đang chấm</span></div>
                </div>
                <div class="contest-stats-bar" role="img" aria-label="Tỉ lệ trạng thái bài nộp">
                    <i class="accepted" style="width:${percent(counts.accepted)}%"></i>
                    <i class="wrong" style="width:${percent(counts.wrong)}%"></i>
                    <i class="pending" style="width:${percent(counts.pending)}%"></i>
                    <i class="other" style="width:${percent(counts.other)}%"></i>
                </div>
                <p class="muted">Thống kê dựa trên ${total} bài nộp gần nhất được hệ thống trả về.</p>
            ` : '<p class="muted">Chưa có dữ liệu bài nộp để thống kê.</p>';
        }

        if (!rows.length) {
            box.innerHTML = `<p class="empty">${t("noSubmissions")}</p>`;
            return;
        }

        box.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>${t("problem")}</th>
                            <th>${t("result")}</th>
                            <th>${t("score")}</th>
                            <th>${t("time")}</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map(r => {
                            const pid = r.problem_id ?? r.problemId ?? '';
                            const problem = problemList.find(
                                p => String(p.id) === String(pid)
                            );
                            const title = r.problem_title || r.problem_name ||
                                problem?.title || pid || t("problem");
                            const status = r.status || r.result || t("judging");
                            const score = r.score ?? r.points ?? r.points_earned ?? '—';
                            const time = r.created_at || r.submitted_at ||
                                r.submission_time || r.time;
                            const sid = r.submission_id ?? r.id;

                            return `
                                <tr>
                                    <td>
                                        ${sid !== undefined && sid !== null
                                            ? `<a href="/submission/${encodeURIComponent(sid)}">${esc(title)}</a>`
                                            : `<a href="#problemDetailPanel" data-submission-pid="${esc(pid)}">${esc(title)}</a>`
                                        }
                                    </td>
                                    <td>
                                        <span class="status-pill ${statusClass(status)}">
                                            ${esc(status)}
                                        </span>
                                    </td>
                                    <td>${esc(score)}</td>
                                    <td>${esc(dateText(time))}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        `;

        box.querySelectorAll('[data-submission-pid]').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const pid = a.dataset.submissionPid;
                if (pid) showProblem(pid);
            });
        });
    } catch (error) {
        box.innerHTML = `
            <p class="muted">
                ${t("loadHistoryFailed")}${esc(error.message)}
            </p>
            <p class="muted">${t("checkEndpoint")}</p>
        `;
    }
}

$("refreshSubmissions").addEventListener('click', async () => {
    $("refreshSubmissions").disabled = true;

    try {
        await loadContestSubmissions();
    } finally {
        $("refreshSubmissions").disabled = false;
    }
});

/* =========================
   NỘP BÀI
========================= */

$("submitForm").addEventListener('submit', async event => {
    event.preventDefault();

    const problemId = $("problemId").value;
    const sourceCode = $("sourceCode").value;
    const languageId = Number($("language").value);
    const button = $("submitButton");
    const message = $("submitMessage");

    if (!problemId || !sourceCode.trim()) {
        message.textContent = t("chooseAndEnterCode");
        message.className = 'status error';
        return;
    }

    if (!contestData || contestData.state !== 'running') {
        message.textContent = t("contestNotAccepting");
        message.className = 'status error';
        return;
    }

    button.disabled = true;
    message.textContent = t("sending");
    message.className = 'status';

    try {
        const result = await api(`/api/contests/${CONTEST_ID}/submit`, {
            method: 'POST',
            body: JSON.stringify({
                problem_id: problemId,
                contest_id: CONTEST_ID,
                language_id: languageId,
                source_code: sourceCode
            })
        });

        if (!result.submission_id) {
            throw new Error(t("noSubmissionId"));
        }

        window.location.href =
            `/submission/${encodeURIComponent(result.submission_id)}`;
        return;

    } catch (error) {
        message.textContent = t("submitFailed") + error.message;
        message.className = 'status error';
    } finally {
        button.disabled = !contestData || contestData.state !== 'running';
    }
});

/* =========================
   KHỞI TẠO TRANG
========================= */

async function init() {
    translatePage();

    if (!CONTEST_ID) {
        $("contestHeader").innerHTML = `
            <h2 class="error">${t("noContestId")}</h2>
            <p class="muted">${t("checkUrl")}</p>
        `;
        $("problems").textContent = t("noData");
        $("leaderboard").textContent = t("noData");
        $("contestSubmissions").textContent = t("noData");
        return;
    }

    try {
        // Tải quyền quản trị và nội dung kỳ thi song song, không chờ tuần tự.
        await Promise.all([
            loadAdmin(),
            loadContest()
        ]);

        openProblemFromUrl();

        // Hai bảng phụ tải song song, không chặn phần đề thi.
        Promise.allSettled([
            loadLeaderboard(),
            loadContestSubmissions()
        ]);

        // Giảm tải DB: chỉ làm mới khi tab đang mở và mỗi 60 giây.
        submissionRefreshTimer = setInterval(() => {
            if (document.visibilityState === 'visible') {
                loadContestSubmissions();
                loadLeaderboard();
            }
        }, 60000);

    } catch (error) {
        $("contestHeader").innerHTML = `
            <h2 class="error">${t("loadFailed")}</h2>
            <p class="error">${esc(error.message)}</p>
            <p class="muted">${t("checkRender")}</p>
        `;
        $("problems").textContent = t("noProblemList");
    }
}

window.addEventListener('beforeunload', () => {
    if (submissionRefreshTimer) {
        clearInterval(submissionRefreshTimer);
    }
});

init();
</script>

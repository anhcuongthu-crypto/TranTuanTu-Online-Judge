<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin bài nộp - TranTu OJ</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f3f8fc;
    color: #244761;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px 6%;
    background: white;
    border-bottom: 1px solid #dce8f2;
}

header a {
    color: #2879bd;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 760px;
    margin: 45px auto;
    padding: 0 16px;
}

.panel {
    background: white;
    border: 1px solid #dce8f2;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 5px 20px #0f172a0a;
}

h1 { margin-top: 0; }

.muted {
    color: #718ba0;
    line-height: 1.7;
}

.info {
    margin: 24px 0;
    padding: 18px;
    background: #f4f9fd;
    border: 1px solid #dce8f2;
    border-radius: 10px;
}

.info p { margin: 9px 0; }

button {
    border: 0;
    border-radius: 9px;
    padding: 13px 18px;
    background: #2879bd;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:hover { background: #176eaf; }

.secondary {
    background: #eaf3fa;
    margin-left: 6px;
}

.secondary:hover { background: #dcecf8; }

#message {
    margin-top: 16px;
    color: #718ba0;
    line-height: 1.6;
}

@media (max-width: 520px) {
    .panel { padding: 20px; }
    button { width: 100%; margin: 5px 0; }
    .secondary { margin-left: 0; }
}
</style>
</head>

<body>
<header>
    <a href="/">TranTu OJ</a>
</header>

<main>
    <section class="panel">
        <h1>Thông tin bài nộp</h1>
        <p class="muted">
            Bài làm của bạn đã được gửi lên hệ thống.
            Bạn có thể mở trang kết quả để theo dõi quá trình chấm.
        </p>

        <div class="info">
            <p><b>Mã bài nộp:</b> #{{ submission_id }}</p>
            <p><b>Trạng thái:</b> Đã gửi yêu cầu chấm</p>
            <p class="muted">
                Kết quả có thể chưa xuất hiện ngay nếu hệ thống đang chấm bài.
            </p>
        </div>

        <button id="viewResult">Xem kết quả chấm bài →</button>
        <button class="secondary" onclick="history.back()">
            Quay lại
        </button>

        <div id="message"></div>
    </section>
</main>

<script>
const submissionId = {{ submission_id | tojson }};

document.getElementById('viewResult').addEventListener('click', () => {
    window.location.href =
        '/submission/' + encodeURIComponent(submissionId);
});
</script>

<script id="trantu-contest_submission-theme-switch-controller">
(function(){
 const root=document.documentElement;
 const meta=document.querySelector('meta[name="color-scheme"]');
 function setTheme(theme,save){
  const light=theme==='light';
  root.classList.toggle('theme-light',light);
  root.classList.toggle('theme-dark',!light);
  if(meta)meta.content=light?'light':'dark';
  document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeChoice===(light?'light':'dark')?'true':'false'));
  if(save){try{localStorage.setItem('oj_theme',light?'light':'dark')}catch(_){}}
 }
 let pref='dark';try{pref=localStorage.getItem('oj_theme')||'dark'}catch(_){}
 setTheme(pref,false);
 const group=document.createElement('div');group.className='theme-switch-standalone';group.setAttribute('role','group');group.setAttribute('aria-label','Giao diện');
 group.innerHTML='<button type="button" data-theme-choice="light" aria-pressed="false">☀️ Sáng</button><button type="button" data-theme-choice="dark" aria-pressed="false">🌙 Tối</button>';
 document.body.appendChild(group);
 group.addEventListener('click',e=>{const b=e.target.closest('[data-theme-choice]');if(b)setTheme(b.dataset.themeChoice,true)});
})();
</script>

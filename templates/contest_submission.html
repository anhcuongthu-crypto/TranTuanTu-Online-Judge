<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin bài nộp - TranTu OJ</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f3f8fc;
    color: #244761;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px 6%;
    background: white;
    border-bottom: 1px solid #dce8f2;
}

header a {
    color: #2879bd;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 760px;
    margin: 45px auto;
    padding: 0 16px;
}

.panel {
    background: white;
    border: 1px solid #dce8f2;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 5px 20px #0f172a0a;
}

h1 { margin-top: 0; }

.muted {
    color: #718ba0;
    line-height: 1.7;
}

.info {
    margin: 24px 0;
    padding: 18px;
    background: #f4f9fd;
    border: 1px solid #dce8f2;
    border-radius: 10px;
}

.info p { margin: 9px 0; }

button {
    border: 0;
    border-radius: 9px;
    padding: 13px 18px;
    background: #2879bd;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

button:hover { background: #176eaf; }

.secondary {
    background: #eaf3fa;
    margin-left: 6px;
}

.secondary:hover { background: #dcecf8; }

#message {
    margin-top: 16px;
    color: #718ba0;
    line-height: 1.6;
}

@media (max-width: 520px) {
    .panel { padding: 20px; }
    button { width: 100%; margin: 5px 0; }
    .secondary { margin-left: 0; }
}
</style>
</head>

<body>
<header>
    <a href="/">TranTu OJ</a>
</header>

<main>
    <section class="panel">
        <h1>Thông tin bài nộp</h1>
        <p class="muted">
            Bài làm của bạn đã được gửi lên hệ thống.
            Bạn có thể mở trang kết quả để theo dõi quá trình chấm.
        </p>

        <div class="info">
            <p><b>Mã bài nộp:</b> #{{ submission_id }}</p>
            <p><b>Trạng thái:</b> Đã gửi yêu cầu chấm</p>
            <p class="muted">
                Kết quả có thể chưa xuất hiện ngay nếu hệ thống đang chấm bài.
            </p>
        </div>

        <button id="viewResult">Xem kết quả chấm bài →</button>
        <button class="secondary" onclick="history.back()">
            Quay lại
        </button>

        <div id="message"></div>
    </section>
</main>

<script>
const submissionId = {{ submission_id | tojson }};

document.getElementById('viewResult').addEventListener('click', () => {
    window.location.href =
        '/submission/' + encodeURIComponent(submissionId);
});
</script>

<style id="trantu-contest-submission-led-final">
:root{color-scheme:dark!important;--bg:#06111f;--panel:#0b1b2d;--line:rgba(91,197,235,.22);--text:#e4f2ff;--muted:#91abc2}
html,body{min-height:100%;background:radial-gradient(ellipse at 12% 0%,rgba(29,126,160,.13),transparent 34%),radial-gradient(ellipse at 88% 12%,rgba(103,77,190,.13),transparent 32%),#06111f!important;color:#e4f2ff!important;color-scheme:dark!important}
header,nav,.topbar{background:#081a2b!important;color:#e5f5ff!important;border-color:rgba(91,197,235,.2)!important}
main,.container,.page,.content{color:#e4f2ff!important}
:is(.panel,.card,.box,.submission-card,.details-card,section,article,.table-wrap){background:#0b1b2d!important;color:#dceeff!important;border:1px solid rgba(91,197,235,.22)!important;border-radius:14px!important;box-shadow:0 12px 34px rgba(0,0,0,.2)!important}
h1,h2,h3,h4,strong,label,th{color:#e7f5ff!important}
p,small,.muted,.description{color:#9bb2c7!important}
a{color:#71def5!important}a:hover{color:#c0f5ff!important}
input,select,textarea{background:#071727!important;color:#e2f3ff!important;border:1px solid rgba(91,197,235,.28)!important;color-scheme:dark!important}
button,.button,.btn{background:linear-gradient(110deg,#126b88,#4c55a6)!important;color:#effcff!important;border:1px solid rgba(104,224,247,.42)!important;box-shadow:0 0 17px rgba(44,184,219,.13)!important}
table{background:#091a2b!important;color:#dceeff!important;border-color:rgba(91,197,235,.2)!important}
th{background:#102a42!important;color:#aeeeff!important;border-color:rgba(91,197,235,.22)!important}
td{background:#0b1c2e!important;color:#d5e7f6!important;border-color:rgba(91,197,235,.14)!important}
tbody tr:nth-child(even) td{background:#0e2237!important}
pre,pre code,code{background:#071522!important;color:#9fe9ff!important;border-color:rgba(91,197,235,.2)!important}
</style>
</body>
</html>

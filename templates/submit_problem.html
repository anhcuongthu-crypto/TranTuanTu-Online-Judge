
{% extends 'base.html' %}

{% block title %}Nộp bài {{ problem.id }} — OJ Studio{% endblock %}

{% block content %}
<div class="breadcrumbs">
    <a href="/problems/{{ problem.id }}">← Quay lại đề bài</a>
    <span>/</span>
    <span>Nộp bài</span>
</div>

<section class="glass-card" style="width:100%;box-sizing:border-box;">
    <span class="eyebrow">SUBMIT SOLUTION</span>
    <h1>{{ problem.id }} · {{ problem.title }}</h1>

    <p class="muted">
        Đọc kỹ đề bài trước khi nộp.
        <a href="/problems/{{ problem.id }}">Xem đề bài</a>
    </p>

    <label for="language">Ngôn ngữ</label>
    <select id="language">
        <option value="54">C++ (GCC 9.2.0)</option>
    </select>

    <label for="source">Mã nguồn</label>
    <textarea
        id="source"
        rows="22"
        spellcheck="false"
        style="display:block;width:100%;box-sizing:border-box;resize:vertical;font-family:monospace;tab-size:4;"
    >#include &lt;bits/stdc++.h&gt;
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    return 0;
}</textarea>

    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button
            id="submit"
            class="button button-primary"
            style="min-width:160px;"
            data-problem="{{ problem.id }}"
            type="button"
        >
            Nộp bài <span>↗</span>
        </button>
    </div>

    <pre
        id="result"
        class="result-box"
        aria-live="polite"
        style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:20px;"
    >Sẵn sàng nộp bài.</pre>
</section>

<script>
(() => {
    const button = document.getElementById('submit');
    const source = document.getElementById('source');
    const language = document.getElementById('language');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
        const code = source.value;

        if (!code.trim()) {
            result.textContent = 'M chưa nhập mã nguồn!';
            source.focus();
            return;
        }

        button.disabled = true;
        button.textContent = 'Đang gửi bài...';
        result.textContent = 'Đang gửi mã nguồn lên hệ thống...';

        try {
            const response = await fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    problem_id: button.dataset.problem,
                    source_code: code,
                    language_id: Number(language.value)
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Không thể nộp bài.');
            }

            if (!data.submission_id) {
                throw new Error('Hệ thống chưa trả về mã bài nộp.');
            }

            result.textContent = 'Nộp bài thành công! Đang chuyển đến trang kết quả...';

            window.location.href =
                '/submission/' + encodeURIComponent(data.submission_id);

        } catch (error) {
            result.textContent = 'Lỗi: ' + error.message;
            button.disabled = false;
            button.innerHTML = 'Nộp bài <span>↗</span>';
        }
    });
})();
</script>
{% endblock %}
